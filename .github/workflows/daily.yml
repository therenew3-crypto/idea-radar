name: 일일 사업 기회 분석

on:
  schedule:
    # 매일 한국시간(KST) 오전 6시 = UTC 21:00 (전날)
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write   # 결과 JSON 을 저장소에 커밋하기 위함

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}        # 미설정 시 코드 기본값 사용
          DEEP_DIVE_COUNT: ${{ vars.DEEP_DIVE_COUNT }}  # 심층분석 개수 (미설정 시 5)
        run: python src/run.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) 일일 사업 기회 분석"
          # 분석 중 원격이 바뀌었을 수 있으므로, 받아서 합친 뒤 푸시 (충돌 대비 재시도)
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "푸시 성공"
              exit 0
            fi
            echo "원격이 변경됨 — 재시도 $i..."
            sleep $((i * 3))
          done
          echo "푸시 최종 실패"
          exit 1
