name: 일일 사업 기회 분석

on:
  schedule:
    # 매일 한국시간(KST) 오전 8시 = UTC 23:00 (전날)
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write   # 결과 JSON 을 저장소에 커밋하기 위함

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행
        env:
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}   # 미설정 시 코드 기본값 사용
        run: python src/run.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) 일일 사업 기회 분석"
            git push
          fi
