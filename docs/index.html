<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🚀 1인 사업 기회 리서치 대시보드</title>

  <!-- PWA: 홈 화면 추가 / 전체화면 / 오프라인 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ff6b35" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="사업기회" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚀 1인 사업 기회 리서치</h1>
    <div class="toolbar">
      <select id="date-select" class="snap-select" aria-label="스냅샷(날짜·시각) 선택"></select>
      <div class="btn-row">
        <button id="refresh" class="btn" title="최신 데이터 다시 불러오기">🔄 새로고침</button>
        <a id="reanalyze" class="btn ghost"
           href="https://github.com/therenew3-crypto/1/actions/workflows/daily.yml"
           target="_blank" rel="noopener"
           title="GitHub에서 새 분석 실행 (비밀번호 필요·과금)">⚡ 새 분석 🔒</a>
      </div>
    </div>
    <div id="status" class="status"></div>
  </header>

  <main id="app">
    <p class="loading">데이터를 불러오는 중…</p>
  </main>

  <footer>
    <small>Product Hunt + Claude 자동 분석 · 매일 갱신 ·
      시장규모·경쟁사·요금제는 <b>LLM 추정치</b>이므로 의사결정 전 직접 검증하세요.</small>
  </footer>

  <script src="app.js"></script>
  <script>
    // 서비스 워커 등록 (오프라인 캐시)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
